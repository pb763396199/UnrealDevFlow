name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-release:
    name: Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        # 版本从 rust-toolchain.toml 里读出来传进去。这个 action 不会自己读那个
        # 文件，但本地 cargo 会——不这样接一下，两边又会各说各的。
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Release preflight
        shell: pwsh
        run: scripts/release-preflight.ps1 -Strict

      - name: Generate release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          scripts/generate-release-notes.ps1 -Version $version -OutputPath dist/RELEASE_NOTES.md

      - name: Package release
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          scripts/package-release.ps1 -Version $version -SkipBuild

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: UnrealDevFlow ${{ github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/udf.exe
            dist/unrealdevflow-x86_64-pc-windows-msvc.zip
            dist/unrealdevflow-installer.ps1
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md

